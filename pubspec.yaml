name: aetheria
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts of the product and file versions.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.3
  go_router: ^18.0.1
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  simple_gradient_text: ^1.4.0
  logger: ^2.8.0
  dio: ^5.11.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  flutter_launcher_icons: ^0.14.4
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font
  # is included in your application.
  uses-material-design: true

  # Assets
  assets:
    - assets/SVG/1603200920weather-symbol.svg
    - assets/images/Gemini_Generated_Image_ (1).png
    - assets/images/Gemini_Generated_Image_ (2).png
    - assets/images/Gemini_Generated_Image_ (3).png
    - assets/images/Gemini_Generated_Image_ (4).png
    - assets/images/Gemini_Generated_Image_.png
    - assets/images/Gemini_Generated_Image_plv5raplv5raplv5.jpg
    - assets/images/Gemini_Generated_Image_ub7962ub7962ub79.jpg
    - assets/images/Gemini_Generated_Image_umwt82umwt82umwt.jpg
    - assets/images/Gemini_Generated_Image_.jfif
    - assets/images/Gemini_Generated_Image_iojod7iojod7iojo.jpg
    - assets/images/Gemini_Generated_Image_udh2zqudh2zqudh2.jpg
    - assets/images/Gemini_Generated_Image_yve5r6yve5r6yve5.jpg
    - assets/images/Gemini_Generated_Image_ibqxrlibqxrlibqx.jpg
   

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

# تنظیمات مربوط به آیکون اپلیکیشن
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/photo_2026-09-18_15-31-37.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/photo_2026-09-18_15-31-37.jpg"
  min_sdk_android: 21